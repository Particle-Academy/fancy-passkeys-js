name: Publish to npm

# Publishes on a version tag via GitHub Actions Trusted Publishing (OIDC).
# No tokens anywhere: the bootstrap token this package first shipped with has
# been revoked and its Trusted Publisher configured.
#
# npm is pinned to 11.18.0: OIDC needs 11.5+, the runner ships 10.x, and
# npm@latest (12.x) broke --provenance/sigstore.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
